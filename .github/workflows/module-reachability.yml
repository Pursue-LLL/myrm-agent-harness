name: Module Reachability

on:
  pull_request:
    paths:
      - 'src/myrm_agent_harness/**/*.py'
      - 'pyproject.toml'
      - 'scripts/check_module_reachability.py'
      - 'scripts/module_reachability_*.py'
      - 'tests/scripts/test_*module_reachability*.py'
      - '.github/workflows/module-reachability.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  module-reachability:
    name: No unit left without a production consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The engine reads the server tree as a consumer (scripts/tool_registry_config.py resolves it as
      # ../myrm-agent/myrm-agent-server), and diff mode compares against the merge-base, so the harness
      # needs its full history and the server repository sits next to it.
      - name: Checkout code (full history for the merge-base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: myrm-agent-harness
          fetch-depth: 0
          submodules: false

      - name: Checkout sibling server repo (consumer evidence)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/myrm-agent
          path: myrm-agent
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # Fails only for units this change leaves without a production consumer; there is no baseline or allowlist,
      # and an unresolvable base is an error, never a pass.
      - name: Check module reachability against the merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd myrm-agent-harness
          uv run --no-project --python 3.13 python scripts/check_module_reachability.py \
            --require-server --base "origin/${BASE_REF}"
