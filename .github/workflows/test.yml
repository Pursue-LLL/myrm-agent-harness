name: Harness Test Suite

on:
  pull_request:
    paths:
      - 'src/myrm_agent_harness/**/*.py'
      - 'tests/**'
      - 'scripts/**'
      - '**/*.md'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - main
    paths:
      - 'src/myrm_agent_harness/**/*.py'
      - 'tests/**'
      - 'scripts/**'
      - '**/*.md'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit tests (memory-safe profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # Installs exactly what uv.lock pins; a stale lock fails here (run `uv lock` after editing pyproject.toml).
      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Run unit tests
        run: uv run --no-sync pytest -n 2 --dist=loadscope -q --tb=short tests/ --timeout=300 --timeout-method=thread -o faulthandler_timeout=240

  browser-integration:
    name: Browser integration (serial Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # The `integration or e2e` selection collects suites from every extra, so `[browser]` alone
      # fails at collection.
      - name: Install dependencies (all extras)
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Install Patchright Chromium
        run: uv run --no-sync patchright install --with-deps chromium

      - name: Run browser integration tests
        run: >-
          uv run --no-sync pytest -n0 -v -rfE --tb=short tests/
          -m "integration or e2e" --timeout=300 --timeout-method=thread -o faulthandler_timeout=240
