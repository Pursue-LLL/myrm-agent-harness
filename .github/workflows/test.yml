name: Harness Test Suite

on:
  pull_request:
    paths:
      - 'src/myrm_agent_harness/**/*.py'
      - 'tests/**'
      - 'scripts/**'
      - '**/*.md'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - main
    paths:
      - 'src/myrm_agent_harness/**/*.py'
      - 'tests/**'
      - 'scripts/**'
      - '**/*.md'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit tests (memory-safe profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # `uv sync` / `uv run` resolve every extra, including `compiled-core*`, whose pins name
      # versions that exist only after a release is published. Install into the venv directly.
      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -e ".[all]" --group dev

      - name: Run unit tests
        run: uv run --no-sync pytest -n 2 --dist=loadscope -q --tb=short tests/

  browser-integration:
    name: Browser integration (serial Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # Same install as the unit job (see there). The `integration or e2e` selection collects
      # suites from every extra, so `[browser]` alone fails at collection.
      - name: Install dependencies (all extras)
        run: |
          uv venv --python 3.13
          uv pip install -e ".[all]" --group dev

      - name: Install Patchright Chromium
        run: uv run --no-sync patchright install --with-deps chromium

      - name: Run browser integration tests
        run: >-
          uv run --no-sync pytest -n0 -q --tb=short tests/
          -m "integration or e2e" --timeout=600
