<!-- Signatures, handlers, and official seal container -->
<div class="signature-section">
    <div class="sig-column">
        <span class="sig-title">开票人 / 经办人 (Prepared By)</span>
        <div class="sig-line">
            <span class="sig-name">{{ issuer_person | default(cashier | default(handler | default("系统自动出具"))) }}</span>
        </div>
    </div>
    
    <div class="sig-column">
        <span class="sig-title">审核人 / 财务主管 (Approved By)</span>
        <div class="sig-line">
            <span class="sig-name">{{ auditor_person | default(approver | default("财务审核专用")) }}</span>
        </div>
    </div>
    
    <div class="sig-column seal-column">
        <span class="sig-title">单位盖章 (Official Stamp)</span>
        <div class="stamp-placeholder">
            {% if official_seal_text %}
            <div class="svg-official-seal">
                <svg viewBox="0 0 120 120" class="seal-svg" width="110" height="110">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="4,2"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#d93025" stroke-width="2"/>
                    <polygon points="60,32 64,44 76,44 66,52 70,64 60,56 50,64 54,52 44,44 56,44" fill="#d93025"/>
                    <text x="60" y="82" font-size="9" text-anchor="middle" fill="#d93025" font-weight="bold" font-family="sans-serif">{{ official_seal_text }}</text>
                    <text x="60" y="94" font-size="7" text-anchor="middle" fill="#d93025" font-family="sans-serif">财务专用章</text>
                </svg>
            </div>
            {% else %}
            <div class="seal-box-border">
                <span class="seal-hint">(请在此处加盖公章)</span>
            </div>
            {% endif %}
        </div>
    </div>
</div>
