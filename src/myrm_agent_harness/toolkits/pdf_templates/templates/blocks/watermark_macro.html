{% macro render_watermark(text='CONFIDENTIAL', opacity=0.06, angle=-30) -%}
<div class="watermark-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: flex; align-items: center; justify-content: center; overflow: hidden;">
  <div style="transform: rotate({{ angle }}deg); font-size: 72pt; font-weight: 900; color: rgba(15, 23, 42, {{ opacity }}); letter-spacing: 16px; text-transform: uppercase; user-select: none;">
    {{ text }}
  </div>
</div>
{%- endmacro %}
